# Adaptador de salida JPA con H2 guardado en archivo (./data).
# AUTO_SERVER=TRUE permite que la API y la CLI usen la misma base al mismo tiempo.
spring.datasource.url=jdbc:h2:file:./data/biblioteca;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
